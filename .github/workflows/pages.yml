# Publie le portfolio sur GitHub Pages à chaque push sur la branche main.
# Dans GitHub : Settings > Pages > Build and deployment > Source : "GitHub Actions".
name: Publier le portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Générer le site
        id: site
        # Le dépôt d'origine publie la galerie de tous les modèles ;
        # votre copie publie votre propre portfolio (dossier docs/).
        run: |
          if [ "${{ github.repository }}" = "Djamal029/portfolio-markdown-templates" ]; then
            uv run build.py --preview-all --no-serve --no-open
            echo "dir=previews" >> "$GITHUB_OUTPUT"
          else
            uv run build.py
            echo "dir=docs" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
