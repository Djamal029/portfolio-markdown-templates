# Réglages généraux du site. Les lignes qui commencent par # sont des commentaires.

# Langue de l'interface (menus, titres, mois) : en ou fr
language: fr

# Modèle visuel : a (Editorial, une page), b (Cards, plusieurs pages) ou c (Sidebar, profil à gauche)
template: b

# Titre affiché dans l'onglet du navigateur et sur les moteurs de recherche
title: "Alex Martin, élève ingénieur en data science à l'ENSAI"
description: "Portfolio d'Alex Martin, élève ingénieur en statistique et science des données à l'ENSAI."

# Adresse finale du site (facultatif, sert aux aperçus de liens). Exemple : https://pseudo.github.io/portfolio/
base_url: ""

# ----- Couleurs -----------------------------------------------------------
# Palette toute prête : teal, indigo, forest, sunset ou graphite.
# Laissez vide pour la palette du modèle (A : teal, B : indigo, C : graphite).
palette: ""

# Couleurs personnalisées (facultatif), toujours entre guillemets. Vide = couleur de la palette.
#   primary    : boutons et liens principaux
#   secondary  : petits détails (étiquettes, mentions « À la une »)
#   background : fond de la page
#   surface    : fond des cartes
#   text       : texte
colors:
  primary: ""
  secondary: ""
  background: ""
  surface: ""
  text: ""

# Mêmes réglages pour le mode sombre (facultatif). Vide = calculé automatiquement.
dark_colors:
  primary: ""
  secondary: ""
  background: ""
  surface: ""
  text: ""

# Mode sombre disponible (bouton lune/soleil) : true ou false
dark_mode: true

# ----- Polices ------------------------------------------------------------
# Choix possibles : inter, plus-jakarta-sans, space-grotesk, ibm-plex-sans,
# fraunces, lora, source-serif-4, jetbrains-mono, system. Vide = police du modèle.
fonts:
  heading: ""
  body: ""

# Polices Google Fonts (true) ou polices de l'ordinateur uniquement (false)
google_fonts: true

# ----- Sections -----------------------------------------------------------
# Une section sans contenu est cachée automatiquement.
sections:
  about: true
  experiences: true
  projects: true
  skills: true
  education: true
  contact: true
